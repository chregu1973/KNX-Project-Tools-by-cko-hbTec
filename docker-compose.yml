services:
  knx-tools:
    build: .
    container_name: knx-label-creator-v2
    restart: unless-stopped
    ports:
      - "5002:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-60}
      SESSION_CLEANUP_INTERVAL_SECONDS: ${SESSION_CLEANUP_INTERVAL_SECONDS:-300}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_CLEANUP_ENABLED: ${SESSION_CLEANUP_ENABLED:-true}
    volumes:
      - ./data:/data
