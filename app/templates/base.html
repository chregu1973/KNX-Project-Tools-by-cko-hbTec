<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}KNX Label Creator V2{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='toolbox/cko-ui.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/label-creator-v2.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/labels-v2.css') }}">
</head>

<body
    data-active-tool="knx-tools"
    data-tool-title="KNX Label Creator">

<div id="cko-sidebar"></div>

<main class="main">
    <div id="cko-topbar"></div>

    <section class="tool-app">
        <div class="tool-app-shell">

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="lc-flashes">
                        {% for msg in messages %}
                            <div class="lc-flash">{{ msg }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            {% block content %}{% endblock %}

            <footer class="footer lc-footer">
                <span>
                    © 2026 Christian Köppen ·
                    Open-Source-Projekt ohne Gewähr
                </span>
                <span>CKO Toolbox · KNX Tools</span>
            </footer>

        </div>
    </section>
</main>

<script src="{{ url_for('static', filename='toolbox/cko-layout.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
